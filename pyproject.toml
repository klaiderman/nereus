[project]
name = "nereus"
version = "0.1.0"
description = "Deterministic camera-AIS fusion for defensible dark-vessel detection."
authors = [{ name = "Tal Klaiderman" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scipy>=1.11"]

[project.optional-dependencies]
ais = ["pyais>=2.6"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nereus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
