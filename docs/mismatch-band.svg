<svg xmlns="http://www.w3.org/2000/svg" width="680" height="190" viewBox="0 0 680 190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="gb" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#12233d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="680" height="190" fill="#0a1628"/>
  <rect width="680" height="190" fill="url(#gb)"/>
  <text x="20" y="30" fill="#eaf2ff" font-size="15" font-weight="700">the mismatch band — distance from a detection to its matched AIS</text>

  <!-- zone bars: 100 m == 200 px, origin x=60 -->
  <rect x="60"  y="78" width="200" height="34" fill="#123020" stroke="#3fb950" stroke-width="1.5"/>
  <rect x="260" y="78" width="200" height="34" fill="#2a1533" stroke="#bc8cff" stroke-width="1.5"/>
  <rect x="460" y="78" width="150" height="34" fill="#2f1414" stroke="#d75952" stroke-width="1.5"/>
  <!-- arrow tip -->
  <path d="M610 78 L640 95 L610 112 Z" fill="#2f1414" stroke="#d75952" stroke-width="1.5"/>

  <!-- zone labels -->
  <text x="160" y="70" fill="#3fb950" font-size="11" text-anchor="middle">matched — normal</text>
  <text x="360" y="64" fill="#bc8cff" font-size="11" text-anchor="middle">POSITION_MISMATCH</text>
  <text x="360" y="76" fill="#8a6fb0" font-size="10" text-anchor="middle">the spoofing signature</text>
  <text x="535" y="70" fill="#d75952" font-size="11" text-anchor="middle">not the same ship</text>

  <!-- in-bar text -->
  <text x="160" y="100" fill="#9fb4d4" font-size="10" text-anchor="middle">accept the pair</text>
  <text x="360" y="100" fill="#eaf2ff" font-size="10" text-anchor="middle">displaced → alert</text>
  <text x="535" y="100" fill="#eaf2ff" font-size="10" text-anchor="middle">DARK + GHOST</text>

  <!-- threshold ticks -->
  <line x1="260" y1="112" x2="260" y2="140" stroke="#7d93b2" stroke-width="1"/>
  <line x1="460" y1="112" x2="460" y2="140" stroke="#7d93b2" stroke-width="1"/>
  <text x="260" y="154" fill="#9fb4d4" font-size="10.5" text-anchor="middle">mismatch_dist</text>
  <text x="260" y="167" fill="#7d93b2" font-size="10" text-anchor="middle">100 m</text>
  <text x="460" y="154" fill="#9fb4d4" font-size="10.5" text-anchor="middle">gate_radius</text>
  <text x="460" y="167" fill="#7d93b2" font-size="10" text-anchor="middle">200 m</text>
  <text x="60" y="130" fill="#7d93b2" font-size="10" text-anchor="middle">0</text>
</svg>
