<svg xmlns="http://www.w3.org/2000/svg" width="880" height="792" viewBox="0 0 880 792" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#12233d" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#bc8cff"/>
    </marker>
    <marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a5578"/>
    </marker>
  </defs>

  <rect width="880" height="792" fill="#0a1628"/>
  <rect width="880" height="792" fill="url(#grid)"/>
  <text x="30" y="42" fill="#eaf2ff" font-size="18" font-weight="700" letter-spacing="1">NEREUS — architecture</text>
  <text x="30" y="62" fill="#9fb4d4" font-size="11.5">deterministic camera-AIS fusion, per frame</text>
  <text x="850" y="62" text-anchor="end" fill="#5f7599" font-size="10.5">transport shown dashed — outside the engine</text>

  <!-- ===== INGRESS: pub/sub (transport, outside the engine) ===== -->
  <rect x="300" y="80" width="280" height="42" rx="10" fill="#0a1628" stroke="#3a5578" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="440" y="99" text-anchor="middle" fill="#9fb4d4" font-size="13" font-weight="600">pub/sub</text>
  <text x="440" y="114" text-anchor="middle" fill="#5f7599" font-size="10">frames in — one per tick</text>
  <path d="M440 122 V132 H250 V146" fill="none" stroke="#3a5578" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowm)"/>
  <path d="M440 122 V132 H630 V146" fill="none" stroke="#3a5578" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowm)"/>

  <!-- ===== inputs ===== -->
  <rect x="110" y="148" width="280" height="52" rx="10" fill="#0f1d33" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="250" y="170" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">camera detections</text>
  <text x="250" y="188" text-anchor="middle" fill="#9fb4d4" font-size="11">bbox + geo-position + class + confidence</text>

  <rect x="490" y="148" width="280" height="52" rx="10" fill="#0f1d33" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="630" y="170" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">AIS messages</text>
  <text x="630" y="188" text-anchor="middle" fill="#9fb4d4" font-size="11">MMSI + position + SOG + COG</text>

  <path d="M250 200 V220 H440 V238" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M630 200 V220 H440" fill="none" stroke="#bc8cff" stroke-width="1.6"/>

  <!-- ===== INGEST ===== -->
  <rect x="220" y="240" width="440" height="58" rx="10" fill="#0f1d33" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="234" y="258" fill="#9fb4d4" font-size="10.5">INGEST</text>
  <text x="440" y="270" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">sanitize · validate · dedupe AIS per vessel</text>
  <text x="440" y="288" text-anchor="middle" fill="#9fb4d4" font-size="11">drop non-finite / stale / duplicate records before fusion</text>
  <path d="M440 298 V320" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== ASSOCIATE ===== -->
  <rect x="220" y="322" width="440" height="70" rx="10" fill="#0f1d33" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="234" y="340" fill="#9fb4d4" font-size="10.5">ASSOCIATE · stateless</text>
  <text x="440" y="356" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">dead-reckon AIS to now · gate · Hungarian assignment</text>
  <text x="440" y="374" text-anchor="middle" fill="#9fb4d4" font-size="11">matched  |  detection with no AIS  |  AIS with no detection</text>

  <!-- ASSOCIATE -> three candidate types -->
  <path d="M440 392 V408 H190 V424" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M440 392 V424" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M440 392 V408 H690 V424" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="90" y="426" width="200" height="46" rx="10" fill="#0f1d33" stroke="#d75952" stroke-width="1.5"/>
  <text x="190" y="448" text-anchor="middle" fill="#d75952" font-size="14" font-weight="600">DARK_VESSEL</text>
  <text x="190" y="464" text-anchor="middle" fill="#9fb4d4" font-size="11">seen, no AIS</text>

  <rect x="340" y="426" width="200" height="46" rx="10" fill="#0f1d33" stroke="#d8853b" stroke-width="1.5"/>
  <text x="440" y="448" text-anchor="middle" fill="#d8853b" font-size="14" font-weight="600">AIS_GHOST</text>
  <text x="440" y="464" text-anchor="middle" fill="#9fb4d4" font-size="11">AIS, unseen (in coverage)</text>

  <rect x="590" y="426" width="200" height="46" rx="10" fill="#0f1d33" stroke="#d8853b" stroke-width="1.5"/>
  <text x="690" y="448" text-anchor="middle" fill="#d8853b" font-size="13" font-weight="600">POSITION_MISMATCH</text>
  <text x="690" y="464" text-anchor="middle" fill="#9fb4d4" font-size="11">matched, positions disagree</text>

  <!-- three types -> FP-GATING -->
  <path d="M190 472 V494 H440 V512" fill="none" stroke="#bc8cff" stroke-width="1.6"/>
  <path d="M440 472 V512" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M690 472 V494 H440" fill="none" stroke="#bc8cff" stroke-width="1.6"/>

  <!-- ===== FP-GATING ===== -->
  <rect x="220" y="514" width="440" height="58" rx="10" fill="#0f1d33" stroke="#d75952" stroke-width="1.5"/>
  <text x="234" y="532" fill="#9fb4d4" font-size="10.5">FP-GATING · earn the right to alert</text>
  <text x="440" y="546" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">size · confidence · coverage · nearest-AIS</text>
  <text x="440" y="563" text-anchor="middle" fill="#9fb4d4" font-size="11">throw away the false alarms; keep only defensible candidates</text>
  <path d="M440 572 V594" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== PERSISTENCE ===== -->
  <rect x="220" y="596" width="440" height="52" rx="10" fill="#0f1d33" stroke="#3fb950" stroke-width="1.5"/>
  <text x="234" y="614" fill="#9fb4d4" font-size="10.5">PERSISTENCE · stateful</text>
  <text x="440" y="628" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">recur N frames (miss-tolerant) → PENDING → ALERT</text>
  <path d="M440 648 V670" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== Anomaly (engine output) ===== -->
  <rect x="300" y="672" width="280" height="48" rx="10" fill="#0f1d33" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="440" y="692" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">Anomaly</text>
  <text x="440" y="708" text-anchor="middle" fill="#9fb4d4" font-size="11">typed alert + explain-trace</text>

  <!-- ===== EGRESS: fan out to three sinks (transport, outside the engine) ===== -->
  <path d="M440 720 V736" fill="none" stroke="#3a5578" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M170 736 H710" fill="none" stroke="#3a5578" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M170 736 V752" fill="none" stroke="#3a5578" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowm)"/>
  <path d="M440 736 V752" fill="none" stroke="#3a5578" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowm)"/>
  <path d="M710 736 V752" fill="none" stroke="#3a5578" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowm)"/>

  <rect x="70" y="754" width="200" height="34" rx="8" fill="#0a1628" stroke="#3a5578" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="170" y="775" text-anchor="middle" fill="#9fb4d4" font-size="12">WebSocket · console</text>

  <rect x="340" y="754" width="200" height="34" rx="8" fill="#0a1628" stroke="#3a5578" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="440" y="775" text-anchor="middle" fill="#9fb4d4" font-size="12">REST · history</text>

  <rect x="610" y="754" width="200" height="34" rx="8" fill="#0a1628" stroke="#3a5578" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="710" y="775" text-anchor="middle" fill="#9fb4d4" font-size="12">PostGIS · tracks</text>
</svg>
