<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#12233d" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#bc8cff"/>
    </marker>
  </defs>

  <rect width="860" height="620" fill="#0a1628"/>
  <rect width="860" height="620" fill="url(#grid)"/>
  <text x="30" y="42" fill="#eaf2ff" font-size="18" font-weight="700" letter-spacing="1">NEREUS — architecture</text>
  <text x="30" y="62" fill="#9fb4d4" font-size="11.5">deterministic camera-AIS fusion, per frame</text>

  <rect x="120" y="86" width="270" height="52" rx="10" fill="#0f1d33" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="255" y="108" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">camera detections</text>
  <text x="255" y="126" text-anchor="middle" fill="#9fb4d4" font-size="11">bbox + geo-position + class + confidence</text>

  <rect x="470" y="86" width="270" height="52" rx="10" fill="#0f1d33" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="605" y="108" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">AIS messages</text>
  <text x="605" y="126" text-anchor="middle" fill="#9fb4d4" font-size="11">MMSI + position + SOG + COG</text>

  <path d="M255 138 V160 H430 V178" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M605 138 V160 H430" fill="none" stroke="#bc8cff" stroke-width="1.6"/>

  <rect x="210" y="180" width="440" height="58" rx="10" fill="#0f1d33" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="224" y="198" fill="#9fb4d4" font-size="10.5">INGEST</text>
  <text x="430" y="210" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">sanitize · validate · dedupe AIS per vessel</text>
  <text x="430" y="228" text-anchor="middle" fill="#9fb4d4" font-size="11">drop non-finite / stale / duplicate records before fusion</text>
  <path d="M430 238 V262" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="210" y="264" width="440" height="70" rx="10" fill="#0f1d33" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="224" y="282" fill="#9fb4d4" font-size="10.5">ASSOCIATE · stateless</text>
  <text x="430" y="298" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">dead-reckon AIS to now · gate · Hungarian assignment</text>
  <text x="430" y="316" text-anchor="middle" fill="#9fb4d4" font-size="11">matched  |  detection with no AIS  |  AIS with no detection</text>
  <path d="M430 334 V356" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="90" y="358" width="200" height="46" rx="10" fill="#0f1d33" stroke="#d75952" stroke-width="1.5"/>
  <text x="190" y="380" text-anchor="middle" fill="#d75952" font-size="14" font-weight="600">DARK_VESSEL</text>
  <text x="190" y="396" text-anchor="middle" fill="#9fb4d4" font-size="11">seen, no AIS</text>

  <rect x="330" y="358" width="200" height="46" rx="10" fill="#0f1d33" stroke="#d8853b" stroke-width="1.5"/>
  <text x="430" y="380" text-anchor="middle" fill="#d8853b" font-size="14" font-weight="600">AIS_GHOST</text>
  <text x="430" y="396" text-anchor="middle" fill="#9fb4d4" font-size="11">AIS, unseen (in coverage)</text>

  <rect x="570" y="358" width="200" height="46" rx="10" fill="#0f1d33" stroke="#d8853b" stroke-width="1.5"/>
  <text x="670" y="380" text-anchor="middle" fill="#d8853b" font-size="13" font-weight="600">POSITION_MISMATCH</text>
  <text x="670" y="396" text-anchor="middle" fill="#9fb4d4" font-size="11">matched, positions disagree</text>

  <path d="M190 404 V428 H430 V444" fill="none" stroke="#bc8cff" stroke-width="1.6"/>
  <path d="M430 404 V444" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M670 404 V428 H430" fill="none" stroke="#bc8cff" stroke-width="1.6"/>

  <rect x="210" y="446" width="440" height="58" rx="10" fill="#0f1d33" stroke="#d75952" stroke-width="1.5"/>
  <text x="224" y="464" fill="#9fb4d4" font-size="10.5">FP-GATING · earn the right to alert</text>
  <text x="430" y="478" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">size · confidence · coverage · nearest-AIS</text>
  <text x="430" y="495" text-anchor="middle" fill="#9fb4d4" font-size="11">throw away the false alarms; keep only defensible candidates</text>
  <path d="M430 504 V526" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="210" y="528" width="440" height="52" rx="10" fill="#0f1d33" stroke="#3fb950" stroke-width="1.5"/>
  <text x="224" y="546" fill="#9fb4d4" font-size="10.5">PERSISTENCE · stateful</text>
  <text x="430" y="560" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">recur N frames (miss-tolerant) → PENDING → ALERT</text>
  <path d="M650 554 H726 V300 H752" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="700" y="276" width="140" height="48" rx="10" fill="#0f1d33" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="770" y="298" text-anchor="middle" fill="#eaf2ff" font-size="14" font-weight="600">Anomaly</text>
  <text x="770" y="314" text-anchor="middle" fill="#9fb4d4" font-size="11">+ explain-trace</text>
</svg>
